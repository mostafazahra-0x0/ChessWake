name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to the same branch supersedes the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep Gradle honest about what it downloads; useful in the failure logs.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # Cheap static checks first: they run in seconds and catch the class of mistake
  # (a dangling import, a missing string resource) that costs a full Android
  # build to discover. `tools/check_consistency.py` is deliberately not a
  # compiler - the `build` job below is the real thing.
  verify:
    name: Static consistency and golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the consistency checker
        run: python tools/check_consistency.py

      - name: Install python-chess
        run: python -m pip install --upgrade pip "chess==1.11.2"

      # The vectors under app/src/test/resources/chess are what ChessEngineVectorTest
      # asserts against, so they must be reproducible from an independent engine.
      # If this step fails, either the vectors were hand-edited or python-chess
      # changed behaviour - both are worth knowing about.
      - name: Regenerate the golden vectors
        run: python tools/generate_test_vectors.py

      - name: Assert the committed vectors are unchanged
        run: |
          if ! git diff --exit-code -- app/src/test/resources/chess; then
            echo "::error::The committed golden vectors do not match tools/generate_test_vectors.py."
            echo "Regenerate them with 'python tools/generate_test_vectors.py' and commit the result."
            exit 1
          fi
          echo "Golden vectors reproduce byte-for-byte from python-chess."

  build:
    name: Assemble and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show the Android SDK the runner provides
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --list_installed 2>/dev/null | head -40 || true
          fi

      # AGP downloads any missing platform or build-tools on demand; the runner
      # images have the SDK licences pre-accepted, so this is a no-op when the
      # runner already ships compileSdk 35.
      - name: Ensure the SDK packages this project compiles against
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found; relying on AGP to resolve the SDK automatically."
          fi

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the debug APK and run the unit tests
        # tee keeps the log for the annotation step below. pipefail is set
        # explicitly: the default Linux shell is `bash -e` *without* pipefail, so
        # a pipeline ending in tee would otherwise report tee's exit status and
        # turn a failed build green.
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Compile errors are otherwise only readable in the CI log. Re-emitting them
      # as annotations puts each one next to its file in the diff and makes a red
      # build legible from the REST API.
      # Test failures carry their assertion messages in the JUnit XML; the console
      # log names only the exception class. This is its own step because GitHub
      # caps annotations at 10 per level per step.
      - name: Publish test failures as check annotations
        if: failure()
        run: python3 tools/annotate_ci_log.py --junit app/build/test-results/testDebugUnitTest

      - name: Publish the failure as check annotations
        if: failure()
        run: python3 tools/annotate_ci_log.py build.log

      # `error` rather than `warn`: a build that produces no APK must never look
      # like a build that succeeded.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chesswake-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the unit test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint and build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            app/build/reports/
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
