# JVM arguments for the Gradle daemon. Compose + KSP + Hilt are memory hungry,
# but CI runners are small, so this is deliberately conservative.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# AndroidX is mandatory (Jetpack Compose, Room, Hilt, DataStore all require it).
android.useAndroidX=true

# Only generate R classes for resources actually declared in this module.
android.nonTransitiveRClass=true

# Build performance. Safe to keep on for a single-module project.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin code style
kotlin.code.style=official
